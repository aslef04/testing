
{% extends "base.html" %}

{% block content %}

<div>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <h1>Update page</h1>

        <label for="profile">Profile image</label>

        {% if data.profile %}
            <img src="{{ data.profile.url }}" width="150" height="150">
        {% endif %}

        <input type="file" id="profile" name="profile">
        <br>

        <label for="full_name">Full name</label>
        <input type="text" id="full_name" name="full_name" value="{{ data.full_name }}">
        <br>

        <label for="user_name">User name</label>
        <input type="text" id="user_name" name="user_name" value="{{ data.user_name }}">
        <br>

        <label for="phone_number">Phone number</label>
        <input type="number" id="phone_number" name="phone_number" value="{{ data.phone_number }}">
        <br>

        <label for="gender">Gender</label>

        <input type="radio" name="gender" value="Male"
        {% if data.gender == 'Male' %} checked {% endif %}>Male

        <input type="radio" name="gender" value="Female"
        {% if data.gender == 'Female' %} checked {% endif %}>Female
        <br>

        <label for="dob">DOB</label>
        <input type="date" id="dob" name="dob" value="{{ data.dob|date:'Y-m-d' }}">
        <br>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ data.email }}">
        <br>

        <label for="address">Address</label>
        <input type="text" id="address" name="address" value="{{ data.address }}">
        <br>

        <label for="password">Password</label>
        <input type="password" id="password" name="password">
        <br>

        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password">
        <br>

        <button type="submit">Update</button>

    </form>
</div>

{% endblock %}
